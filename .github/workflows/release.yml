name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包 .qk 与文档
        run: |
          mkdir -p dist
          zip -r "dist/QuarkLangLibs-Json-${GITHUB_REF_QuarkLangLibs-Json}.zip" . -x '.git/*' -x 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: QuarkLangLibs-Json-package
          path: dist/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
